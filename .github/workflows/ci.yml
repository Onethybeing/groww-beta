name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: groww-start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: groww-start/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npx next build
  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: groww-start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: groww-start/package-lock.json
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --reporter=line
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: groww-start/test-results
